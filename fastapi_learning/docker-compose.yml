services:
  fastapi-learning:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-learning-platform:latest
    container_name: fastapi-learning-platform
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
