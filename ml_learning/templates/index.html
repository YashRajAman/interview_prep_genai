<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ML Odyssey — An interactive machine learning learning platform. Master ML from novice to professional through reading, coding, quizzes, and interactive visualizations.">
    <title>ML Odyssey — Interactive Machine Learning Learning Platform</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CodeMirror CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
        <div class="bg-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav id="main-nav">
        <div class="nav-inner">
            <a href="#" class="nav-logo" id="nav-logo">
                <span class="logo-icon">🧠</span>
                <span class="logo-text">ML <span class="logo-accent">Odyssey</span></span>
            </a>
            <div class="nav-links">
                <a href="#" class="nav-link active" data-route="home" id="nav-home">Home</a>
                <a href="#" class="nav-link" data-route="levels" id="nav-levels">Levels</a>
                <a href="#" class="nav-link" data-route="progress" id="nav-progress">Progress</a>
            </div>
            <div class="nav-progress-mini" id="nav-progress-mini">
                <div class="nav-progress-bar">
                    <div class="nav-progress-fill" id="nav-progress-fill"></div>
                </div>
                <span class="nav-progress-text" id="nav-progress-text">0%</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-content">
        <!-- Content dynamically loaded by app.js -->
        <div class="loading-screen" id="loading-screen">
            <div class="loader">
                <div class="loader-brain">🧠</div>
                <div class="loader-text">Loading your ML journey...</div>
                <div class="loader-bar"><div class="loader-bar-fill"></div></div>
            </div>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="/static/js/progress.js"></script>
    <script src="/static/js/quiz-engine.js"></script>
    <script src="/static/js/code-playground.js"></script>
    <script src="/static/js/visualizations.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
