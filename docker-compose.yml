services:
  ml-learning:
    build:
      context: ./ml_learning
      dockerfile: Dockerfile
    image: ml-learning-platform:latest
    container_name: ml-learning-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/topics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  fastapi-learning:
    build:
      context: ./fastapi_learning
      dockerfile: Dockerfile
    image: fastapi-learning-platform:latest
    container_name: fastapi-learning-platform
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


